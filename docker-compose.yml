services:
  db:
    image: postgres:14
    container_name: rtm_db
    environment:
      POSTGRES_DB: remoteteam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rtm_network

  redis:
    image: redis:7-alpine
    container_name: rtm_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rtm_network

  web:
    build: .
    container_name: rtm_web
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/remoteteam
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
    networks:
      - rtm_network

  celery_worker:
    build: .
    container_name: rtm_celery_worker
    command: celery -A config worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/remoteteam
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - SECRET_KEY=django-insecure-dev-key-change-in-production
    networks:
      - rtm_network

  celery_beat:
    build: .
    container_name: rtm_celery_beat
    command: celery -A config beat -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/remoteteam
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-dev-key-change-in-production
    networks:
      - rtm_network

networks:
  rtm_network:
    driver: bridge