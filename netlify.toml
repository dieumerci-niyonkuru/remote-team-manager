[build]
  command = "npm run build"
  publish = "dist"

# ── API proxy ────────────────────────────────────────────────────────────────
# Forward /api/* to the Railway backend so the browser makes same-origin calls
# (avoids CORS preflight and the 404 that Netlify returns for POST requests
# it doesn't know about).  The :splat captures everything after /api/.
[[redirects]]
  from = "/api/*"
  to = "https://remote-team-manager-production.up.railway.app/api/:splat"
  status = 200
  force = true

# ── SPA catch-all ────────────────────────────────────────────────────────────
# Must come AFTER the API proxy so React Router paths get index.html but
# /api/* calls are already handled above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Stop Netlify from attempting a Python install
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "20"
  # WebSocket host — Netlify cannot proxy WS, so the browser connects directly
  # to the Railway backend for all /ws/* connections.
  VITE_WS_HOST = "remote-team-manager-production.up.railway.app"

# This prevents Netlify from trying to install Python dependencies
[functions]
  node_bundler = "esbuild"
