name: Deploy Check

on:
  push:
    branches: [main]

jobs:
  migration-check:
    name: Migration Consistency Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploy_check_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deploy_check_db
      SECRET_KEY: ci-secret-key-not-for-production-use-only
      DEBUG: "False"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Apply all migrations
        run: python manage.py migrate --run-syncdb

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Verify migration consistency
        run: python manage.py migrate --check
