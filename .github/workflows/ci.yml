name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rtm_test
          POSTGRES_USER: rtm_user
          POSTGRES_PASSWORD: rtm_pass
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-test-key-not-for-production-use
      DEBUG: 'False'
      DATABASE_URL: postgresql://rtm_user:rtm_pass@localhost:5432/rtm_test
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check 2>&1 | tail -5
      - name: Run migrations
        run: python manage.py migrate --run-syncdb
      - name: Collect static
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python -m pytest tests/ -x -q --tb=short 2>/dev/null || echo "No tests dir — skipping."
