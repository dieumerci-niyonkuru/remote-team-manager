name: RemoteTeam CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Backend — Django tests + migration check ──────────────────────────
  backend:
    name: "Backend (Django)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: rtm_test
          POSTGRES_USER: rtm
          POSTGRES_PASSWORD: rtm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-for-production-use-only
      DATABASE_URL: postgres://rtm:rtm@localhost:5432/rtm_test
      REDIS_URL: redis://localhost:6379/0
      # Use DEBUG=True in CI so Django skips HTTPS-only cookie enforcement
      # (SESSION_COOKIE_SECURE / CSRF_COOKIE_SECURE stay False, avoiding
      # test-client issues when running over plain HTTP)
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      FRONTEND_URL: "http://localhost:5173"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify core imports
        run: |
          python -c "import django; print('Django:', django.__version__)"
          python -c "import channels; print('Channels:', channels.__version__)"
          python -c "import rest_framework; print('DRF OK')"
          python -c "import celery; print('Celery:', celery.__version__)"

      - name: Run Django system check
        run: python manage.py check --verbosity 1

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        # Fails the build if any model changes are not reflected in a migration file
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        # Non-fatal — static files may not be fully available in CI (no dist/ from Vite)
        run: python manage.py collectstatic --noinput || echo "⚠ collectstatic skipped (expected in CI)"

      - name: Run tests with coverage
        run: |
          pytest -v --tb=short \
            --cov=apps \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            .coverage
            coverage.xml
          retention-days: 7

  # ── 2. Frontend — Vite build + TypeScript check ──────────────────────────
  frontend:
    name: "Frontend (Vite / React)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (warnings only — does not block CI)
        run: npx tsc --noEmit --skipLibCheck 2>&1 || true

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html && echo "✓ index.html present"
          test -d dist/assets   && echo "✓ assets directory present"
          echo "Bundle size: $(du -sh dist/ | cut -f1)"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ── 3. Security scan (advisory — never blocks merge) ─────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    # Allow this job to fail without blocking the ci-pass gate
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit safety

      - name: Bandit static analysis
        # --exit-zero: report findings but never fail the build
        run: |
          bandit -r apps/ \
            --exclude apps/migrations,apps/*/migrations \
            --severity-level medium \
            --confidence-level medium \
            --exit-zero \
            --format txt

      - name: Dependency vulnerability check
        run: safety check -r requirements.txt || echo "⚠ safety findings above — review manually"

  # ── 4. Gate — both backend AND frontend must pass ────────────────────────
  ci-pass:
    name: "CI Gate"
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate results
        run: |
          echo "Backend : ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "❌ Backend job failed"; exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ Frontend job failed"; exit 1
          fi
          echo "✅ All CI checks passed"
